[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modmail"
version = "0.1.0"
description = "A minimal Discord ModMail bot: shared staff inbox for server members."
requires-python = ">=3.11"
dependencies = [
    "discord.py~=2.6",
    "SQLAlchemy[asyncio]~=2.0",
    "aiosqlite~=0.20",
    "pydantic-settings~=2.5",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "ruff~=0.7",
]

[project.scripts]
modmail = "modmail.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
